[project]
name = "str8ts_solver"
version = "0.4.0"
description = "str8ts solver using z3"
authors = [
  {email = "vil02_str8ts_solver@10g.pl"},
  {name = "Piotr Idzik"}
]
readme = "./str8ts_solver/README.md"
requires-python = ">=3.12"
keywords = ["str8ts", "str8ts solver", "z3"]

dependencies = [
    "z3-solver==5.1.0.0"
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "black==26.5.1",
    "coverage==7.14.1",
    "flake8-bugbear==25.11.29",
    "flake8-pytest-style==2.2.0",
    "flake8==7.3.0",
    "isort==8.0.1",
    "mypy==2.3.1",
    "pylint==4.0.6",
    "pyright[nodejs]==1.1.411",
    "pytest==9.1.1",
    "ruff==0.15.12",
    "xenon==0.9.3"
]

[project.urls]
repository = "https://github.com/vil02/str8ts_solver"
