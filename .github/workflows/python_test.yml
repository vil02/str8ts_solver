---
name: python_test

'on':
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  python_test:
    permissions:
      contents: read
    runs-on: ${{matrix.os}}
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        python-version: [3.13]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and setup python
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Install dependencies
        run: |
          uv lock
          uv sync --frozen --no-build

      - name: Run liter
        run: |
          ./check_all_python_files.sh

      - name: Test with pytest
        run: |
          uv run --frozen --no-build pytest .

  check_examples:
    permissions:
      contents: read
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        python-version: ['3.12', 3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and setup python
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Install basic dependencies
        run: |
          uv pip install .

      - name: Run examples
        run: |
          find examples/ -name "*.py" -exec uv run --no-build --no-sync python3 {} +
...
