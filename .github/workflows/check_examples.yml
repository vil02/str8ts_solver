---
name: check_examples

'on':
  workflow_dispatch:
  workflow_run:
    workflows: [publish]
    types:
      - completed
  schedule:
    - cron: '12 */11 * * *'

permissions:
  contents: read

jobs:
  check_examples:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version: [3.13, 3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{matrix.python-version}}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{matrix.python-version}}

      - name: Install str8ts_solver
        run: |
          pip install str8ts_solver

      - name: Run examples
        shell: bash
        run: |
          find examples/ -name "*.py" -exec python3 {} +
...
