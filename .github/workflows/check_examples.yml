---
name: check_examples

'on':
  workflow_dispatch:
  workflow_run:
    workflows: [publish]
    types:
      - completed
  schedule:
    - cron: '12 */11 * * *'

permissions:
  contents: read

jobs:
  check_examples:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version: [3.13, 3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python ${{matrix.python-version}}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{matrix.python-version}}

      - name: Install str8ts_solver
        run: |
          pip install str8ts_solver

      - name: Run examples
        shell: bash
        run: |
          find examples/ -name "*.py" -exec python3 {} +
...
